<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="description" content="{% if page.title %}{{ page.title | e }}{% else %}{{site.description | e }}{% endif %}{% if page['excerpt_plain'] is defined %} {{ as_single_line_quotable(readfile(page['excerpt_plain'])) | e }}{% endif %}">


  {% if 'DRAFT' in page.tags or 'HIDDEN' in page.tags %}
  <meta name="robots" content="none">
  {% endif %}

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">

  {# RSS is enough, adding Atom may confuse the searchers #}
  <link rel="alternate" type="application/rss+xml" href="{{site.puburl}}/{{site.name_rss}}">

  <link rel="canonical" href="{{ page['url'] }}">

  <link href='/css/load-lato-fonts.min.css' rel='stylesheet' type='text/css'>

  <!-- Style for Slides -->
  <link rel="stylesheet" href="/css/reset.min.css">
  <link rel="stylesheet" href="/css/reveal.min.css">
  <link rel="stylesheet" href="/css/slide-serif.min.css" id="theme">

  <!-- Theme used for syntax highlighted code in Slides -->
  <!-- <link rel="stylesheet" href="plugin/highlight/monokai.css" id="highlight-theme"> -->

</head>
